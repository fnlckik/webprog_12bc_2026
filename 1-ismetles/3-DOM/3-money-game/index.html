<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pénzjáték</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>
    <header>
        <span id="anna-icon">👩</span>
        <h1>Pénzt és győzelmet!</h1>
        <span id="bela-icon">👦</span>
    </header>

    <button class="new-game">Új játék</button>

    <div class="game">
        <div>
            <h2>Maradék pénz: <span id="remaining-money">???</span> Ft</h2>
            <ul id="money-images">
            </ul>
        </div>

        <div id="player-turn">
            <select>
                <option value="a">500 Ft</option>
                <option value="b">1000 Ft</option>
                <option value="c">1500 Ft</option>
                <option value="d">2000 Ft</option>
                <option value="e">2500 Ft</option>
                <option value="f">3000 Ft</option>
            </select>
            <button class="take-money">Összeg választása</button>
        </div>

        <div id="scores">
            <h2>Anna: <span id="anna-money">???</span> Ft</h2>
            <h2>Béla: <span id="bela-money">???</span> Ft</h2>
        </div>

        <div class="winner">
            <h2>🏆 <span></span> nyert! 🏆</h2>
        </div>
    </div>
</body>
</html>
