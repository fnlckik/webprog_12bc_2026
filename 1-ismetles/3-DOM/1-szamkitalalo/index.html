<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        input[type='number'] {
            width: 50px;
        }
        table {
            margin-top: 1em;
        }
        table, td, th {
            border: 1px solid black;
            border-collapse: collapse;
        }
        td, th {
            padding: 0.5em;
        }
    </style>
    <script src="script.js" defer></script>
</head>
<body>
    <h1>Szám kitaláló játék - 1-től 100-ig</h1>
    <label>Tipp: <input type="number" min="1" max="100"></label>
    <input type="button" value="Tippelés" id="guessButton">
    <table>
        <tr>
            <th>Sorszám</th>
            <th>Tippelt szám</th>
            <th>Irány</th>
        </tr>
    </table>
</body>
</html>
